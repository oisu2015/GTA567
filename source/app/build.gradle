plugins {
    id 'com.android.application' version '8.3.2'
}

// 仓库不含签名密钥（keystore/ 已 gitignore）。若 source/keystore/debug.keystore 不存在，
// 构建前自动生成一个演示密钥，保证克隆下来即可 assembleRelease / assembleDebug。
tasks.register('ensureKeystore') {
    def ks = file("$rootDir/keystore/debug.keystore")
    outputs.upToDateWhen { ks.exists() }
    doLast {
        if (!ks.exists()) {
            ks.parentFile.mkdirs()
            def javaHome = System.getProperty('java.home')
            def os = System.getProperty('os.name').toLowerCase()
            def keytool = new File(javaHome, 'bin/keytool' + (os.contains('windows') ? '.exe' : ''))
            if (!keytool.exists()) keytool = new File(javaHome, 'bin/keytool')
            exec {
                commandLine keytool, '-genkeypair', '-v',
                        '-keystore', ks,
                        '-alias', 'androiddebugkey',
                        '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
                        '-storepass', 'android', '-keypass', 'android',
                        '-dname', 'CN=Android Debug,O=Android,C=US'
            }
            println "[DuSheTV] 已自动生成演示签名密钥: $ks"
        }
    }
}
afterEvaluate { project ->
    ['assembleDebug', 'assembleRelease', 'bundleDebug', 'bundleRelease'].each { n ->
        def t = project.tasks.findByName(n)
        if (t) t.dependsOn('ensureKeystore')
    }
}

android {
    namespace 'com.dushetv.box'
    compileSdk 34

    signingConfigs {
        compat {
            storeFile file("$rootDir/keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    defaultConfig {
        applicationId 'com.dushetv.box'
        // 兼容到 Android 4.1，覆盖绝大多数老电视 / 盒子（含 4.4.2）
        minSdk 16
        targetSdk 23
        versionCode 63
        versionName '4.7'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.compat
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.compat
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // v1.5 用 ExoPlayer(自带引擎)，不打包 jniLibs 里影视仓的 ffmpeg .so（避免无效 12MB 体积）
    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// v1.5 起内置 ExoPlayer 2.14.2 作为播放引擎（软解 m3u8/HLS，盒子原生 MediaPlayer 不支持）
// 改为 Maven 依赖，由 Gradle 从 google()/mavenCentral() 拉取完整、未损坏的制品
dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.14.2'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.14.2'
}
